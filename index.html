<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>https://saweria.co/YannnXGT</title>
    <!-- Menggunakan font Poppins dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-light: #fff0f5; 
            --pink-main: #ff69b4; 
            --text-color: #333;
            --border-radius-main: 30px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--pink-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Login Card Styling --- */
        .login-card {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: var(--border-radius-main);
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.2); /* Soft pink shadow */
            text-align: center;
        }

        .title {
            color: var(--pink-main);
            font-weight: 700;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-color);
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffe6f0; /* Border sangat muda */
            border-radius: 15px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus {
            border-color: var(--pink-main);
            box-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
        }

        /* Login Button */
        .login-button {
            width: 100%;
            background-color: var(--pink-main);
            color: white;
            padding: 15px;
            border: none;
            border-radius: var(--border-radius-main);
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 5px 10px rgba(255, 105, 180, 0.5);
            margin-top: 10px;
        }

        .login-button:hover {
            background-color: #ff88c4;
            transform: translateY(-2px);
        }

        .login-button:active {
            transform: translateY(0);
        }
        
        /* Error Message */
        #error-message {
            color: #ff3333; /* Merah untuk pesan error */
            background-color: #ffe6e6;
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 600;
            display: none; /* Sembunyikan secara default */
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="title">Selamat Datang!</h1>
        <p class="subtitle">Silahkan masukkan detail akun Anda</p>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Nama Pengguna </label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="login-button">MASUK</button>
        </form>

        <div id="error-message"></div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Mencegah form submit secara default

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMessageDiv = document.getElementById('error-message');

        
            const CORRECT_USERNAME = 'okta';
            const CORRECT_PASSWORD = '123';
            
   
            if (usernameInput === CORRECT_USERNAME && passwordInput === CORRECT_PASSWORD) {
                
                errorMessageDiv.style.display = 'none';
                alert('Login Berhasil! Mengarahkan ke Dashboard...');
                window.location.href = 'dashboard.html'; 
                
                errorMessageDiv.textContent = 'Nama Pengguna atau Kata Sandi salah! Mohon coba lagi.';
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
